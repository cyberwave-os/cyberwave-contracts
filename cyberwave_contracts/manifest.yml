# Index of every payload contract in the monorepo: who owns it, which tree owns its
# shape, and every place the definition is copied. The JSON Schemas in
# the schemas/ directory beside this file each describe one payload; this file describes
# the contracts themselves, which no schema can. Those facts were previously
# hardcoded in the sync test and in python-sdk-gen.sh, and copies named in neither
# drifted unwatched.
#
# This file and the schemas beside it ship inside the cyberwave-contracts package.
# The SDK, the edge components and anyone writing a driver all read them, and none
# of those can import a Django app directory. The backend is one consumer among
# several -- it serves them over the public contracts API, which is a use, not
# ownership.
#
# `schema` paths are package-relative and resolved from this module. `mirrors`
# paths are monorepo-relative and are NOT resolved by the package: a published
# wheel has no checkout to resolve them against. They are data, and the repo's own
# tests resolve and verify them. A schema with no entry below fails
# cyberwave-backend/src/lib/tests/test_contract_manifest.py.
#
# Which tree may own a shape is a rule, not a preference, and it is directional:
#
#   protobuf     STATE -- what a robot, driver or simulator reports. Defined in
#                common/protobuf/proto, named by `proto_source`.
#   json_schema  COMMANDS AND PLANS -- what the platform issues. Defined in
#                this package's schemas/, named by `schema`.
#   python       Shapes no JSON Schema defines, named by `python_source`. The
#                escape hatch, not a third tier -- and not a synonym for "lives
#                outside the backend": it covers both a dataclass on the edge
#                runtime and a backend validator the SDK mirrors.
#
# Each owner names its definition with its own key and no other, so an entry can
# never be ambiguous about which copy is the source. `python_source` is the one
# exception: any entry may carry it, because a proto- or schema-owned contract
# still has a backend reader, and only the `python` owner treats it as the shape.
# cyberwave_contracts/manifest.py::validate_ownership enforces this.
#
# kind          -- payload (the default; names itself in id_field), overlay or
#                  topic (identified by its MQTT topic; id_field null). See
#                  CONTRACT_KINDS in manifest.py.
# schema        -- the definition when schema_owner is json_schema; omit otherwise
# proto_source  -- the definition when schema_owner is protobuf
# schema_owner  -- json_schema | protobuf | python
# sync          -- generated   rewritten from python_source by a script
#                  field_names hand-maintained; CI checks required field names only
#                  dependency  imports the definition instead of copying it
#
# There is deliberately no kind for a copy nothing verifies: every mirror is
# either generated, checked, or an import. manifest.py rejects anything else.

version: 1

contracts:
  # An overlay constrains fields on another flat payload and therefore does not
  # add a self-identifying `contract` field to the wire message.
  - id: source_type.envelope.v1
    kind: overlay
    owner: contracts
    schema_owner: json_schema
    id_field: null
    schema: cyberwave-contracts/cyberwave_contracts/schemas/source_type.envelope.v1.schema.json
    mirrors: []

  - id: locomotion.velocity_command.v1
    owner: backend
    schema_owner: json_schema
    id_field: contract
    schema: cyberwave-contracts/cyberwave_contracts/schemas/locomotion.velocity_command.v1.schema.json
    # The behavior (normalising, clamping, building, stopping) is defined here, in
    # the package itself. Both contracts in this file share the one module.
    python_source: cyberwave-contracts/cyberwave_contracts/locomotion.py
    mirrors:
      # Still a copy, not an import: the SDK does not depend on this package yet, and
      # until it does (declared in its pyproject.toml, package on PyPI) a copy is
      # what keeps `import cyberwave` working in images that install the SDK alone.
      - path: cyberwave-sdks/cyberwave-python/cyberwave/locomotion_contracts.py
        language: python
        sync: generated
      - path: cyberwave-backend/src/lib/locomotion_contracts.py
        language: python
        # Re-exports the package module, so there is no copy to drift.
        sync: dependency
      - path: cyberwave-edge-nodes/cyberwave-edge-common/cyberwave_edge_common/locomotion_contracts.py
        language: python
        # Re-exports the SDK's generated module (the entry above).
        sync: dependency
      - path: cyberwave-sdks/cyberwave-cpp/include/cyberwave/locomotion_contracts.h
        language: cpp
        sync: field_names

  - id: aerial.velocity_command.v1
    owner: backend
    schema_owner: json_schema
    id_field: contract
    schema: cyberwave-contracts/cyberwave_contracts/schemas/aerial.velocity_command.v1.schema.json
    # Shares a module with the locomotion contract; the C++ header covers only
    # locomotion, so this contract has no cross-language check at all.
    python_source: cyberwave-contracts/cyberwave_contracts/locomotion.py
    mirrors:
      - path: cyberwave-sdks/cyberwave-python/cyberwave/locomotion_contracts.py
        language: python
        sync: generated
      - path: cyberwave-backend/src/lib/locomotion_contracts.py
        language: python
        sync: dependency

  # A flight plan as the operator states it. The vehicle's envelope is not part
  # of it (it comes from the twin's capabilities), and feasibility is decided by
  # the backend's flight-plan validation, which reads every plan through the
  # generated model before its own per-type rules.
  - id: aerial.mission.v1
    owner: backend
    schema_owner: json_schema
    id_field: contract
    schema: cyberwave-contracts/cyberwave_contracts/schemas/aerial.mission.v1.schema.json
    python_source: cyberwave-backend/src/app/services/flight_plans/mission.py
    mirrors:
      - path: cyberwave-backend/src/app/services/flight_plans/mission.py
        language: python
        # Validates with AerialMissionV1 from the installed package.
        sync: dependency

  - id: policy_artifact_manifest.v1
    owner: backend
    schema_owner: json_schema
    # Spells its identity key `version`, not `contract`. The value is a contract id,
    # not a version; renaming it is a wire change both readers below would drop
    # silently, so it needs a dual-read window rather than a rename in place.
    id_field: version
    schema: cyberwave-contracts/cyberwave_contracts/schemas/policy_artifact_manifest.v1.schema.json
    python_source: cyberwave-backend/src/lib/mlmodel_artifact_manifest.py
    mirrors:
      - path: cyberwave-sim/artifacts.py
        language: python
        # Reads the version const from the installed package's generated model.
        sync: dependency

  - id: simulation_policy_manifest.v1
    owner: backend
    schema_owner: json_schema
    id_field: version
    schema: cyberwave-contracts/cyberwave_contracts/schemas/simulation_policy_manifest.v1.schema.json
    python_source: cyberwave-backend/src/app/services/simulation_policy_manifest.py
    mirrors:
      - path: cyberwave-sim/scene/zip_loader.py
        language: python
        # Reads the version const from the installed package's generated model and
        # ignores a manifest whose value does not match.
        sync: dependency

  # The reply half of MQTT v5 request/response for twin commands. A JSON Schema
  # although drivers produce it: it is part of the command plane the platform
  # defines (every command handler must answer in this one shape), not state a
  # device reports on its own. The transport rules -- Response Topic shape,
  # echoed Correlation Data, one reply per request -- are in the schema's
  # description and in this package's README.
  - id: twin.command_response.v1
    owner: backend
    schema_owner: json_schema
    id_field: contract
    schema: cyberwave-contracts/cyberwave_contracts/schemas/twin.command_response.v1.schema.json
    mirrors:
      - path: cyberwave-sdks/cyberwave-python/cyberwave/mqtt/command_response.py
        language: python
        # The SDK's producer (build_command_response), which every driver uses:
        # BaseDriver's CommandRequest and the aerial drivers (PX4, Vector
        # Guardian), whose images install the in-tree SDK. Neither the SDK nor
        # the driver images install cyberwave-contracts, so this is a
        # hand-maintained producer rather than an import. It is checked,
        # though: drivers/tests/px4/test_px4_command_response.py and
        # tests/guardian/test_guardian_gateway.py validate the payloads it builds
        # for them against this schema, which covers more than the field names
        # that `field_names` promises.
        sync: field_names

  # Flat twin telemetry an aircraft driver publishes. These describe state, which
  # SHAPE_OWNERSHIP assigns to common/protobuf; they are JSON Schemas anyway
  # because the wire is JSON on the legacy flat v0 topics, not the protobuf
  # `state/sensors` channel of common/protobuf/README.md, and no proto message
  # describes them. When drivers move to that channel these are superseded rather
  # than re-owned.
  #
  # kind: topic -- the payload is identified by its topic (the schema's
  # x-mqtt-topic), not by a contract field. Deployed publishers, including an
  # Android app, send none, and requiring one would be a v2 nobody emits.
  #
  # The driver mirrors are hand-maintained producers (each driver image builds
  # from its own directory and installs no contracts package). They are checked
  # by validating every payload they build against the schema, which covers more
  # than the field names that `field_names` promises.
  - id: twin.flight_controller.v1
    kind: topic
    owner: backend
    schema_owner: json_schema
    id_field: null
    schema: cyberwave-contracts/cyberwave_contracts/schemas/twin.flight_controller.v1.schema.json
    mirrors:
      - path: cyberwave-backend/src/lib/mqtt_schemas.py
        language: python
        # TwinFlightControllerPayload subclasses the generated model.
        sync: dependency
      - path: cyberwave-edge-runtime/runtime-services/drivers/native/px4/px4_driver/flight_controller.py
        language: python
        # Checked by drivers/tests/px4/test_px4_contracts.py.
        sync: field_names
      - path: cyberwave-edge-runtime/runtime-services/drivers/native/vector-robotics/guardian/guardian_driver/telemetry.py
        language: python
        # Checked by drivers/tests/guardian/test_guardian_contracts.py.
        sync: field_names

  - id: twin.flight_state.v1
    kind: topic
    owner: backend
    schema_owner: json_schema
    id_field: null
    schema: cyberwave-contracts/cyberwave_contracts/schemas/twin.flight_state.v1.schema.json
    # The consumer: persists the report, gated on source_type.
    python_source: cyberwave-backend/src/app/mqtt_consumer.py
    mirrors:
      - path: cyberwave-backend/src/lib/mqtt_schemas.py
        language: python
        # TwinFlightStatePayload subclasses the generated model.
        sync: dependency
      - path: cyberwave-edge-runtime/runtime-services/drivers/native/vector-robotics/guardian/guardian_driver/telemetry.py
        language: python
        # Checked by drivers/tests/guardian/test_guardian_contracts.py.
        sync: field_names
      - path: cyberwave-edge-nodes/cyberwave-edge-dji-mini-android/app/src/main/kotlin/com/cyberwave/edge/dji/dji/TelemetryPublisher.kt
        language: kotlin
        # Checked by cyberwave-backend/src/lib/tests/test_contract_manifest.py,
        # which requires every required field name to appear in the publisher.
        sync: field_names

  - id: twin.battery.v1
    kind: topic
    owner: backend
    schema_owner: json_schema
    id_field: null
    schema: cyberwave-contracts/cyberwave_contracts/schemas/twin.battery.v1.schema.json
    # The consumer. Looser than the schema in one declared way: it also reads
    # `percent` when `percentage` is absent.
    python_source: cyberwave-backend/src/app/mqtt_consumer.py
    mirrors:
      - path: cyberwave-backend/src/lib/mqtt_schemas.py
        language: python
        # TwinBatteryPayload subclasses the generated model.
        sync: dependency
      - path: cyberwave-edge-runtime/runtime-services/drivers/native/vector-robotics/guardian/guardian_driver/telemetry.py
        language: python
        # Checked by drivers/tests/guardian/test_guardian_contracts.py.
        sync: field_names
      - path: cyberwave-edge-nodes/cyberwave-edge-dji-mini-android/app/src/main/kotlin/com/cyberwave/edge/dji/dji/TelemetryPublisher.kt
        language: kotlin
        # Checked like the flight_state entry above.
        sync: field_names

  # Isaac Sim integration (simulation.*). The platform issues the feature profile,
  # the scene bundle manifest and the compatibility attestation -- plans and
  # admission records, squarely json_schema. The runtime audit and the replay
  # trace are produced by a simulator, yet are JSON Schema rather than protobuf
  # for the same reason as twin.command_response.v1: neither is streamed state.
  # The audit is a one-shot admission record the backend validates per workload
  # against what it requested; the trace is a test artifact file (JSON Lines,
  # header as the schema root, one $defs entry per record kind) compared offline
  # by cyberwave_contracts.trace. The behaviour that goes with them -- backend
  # normalisation, bundle digests, path confinement, readiness and run fencing --
  # lives once in python_source, standard library only, so the backend, the
  # Isaac plant and the Isaac cloud node import it instead of re-deriving it.
  # The consumers listed below import the package (sync: dependency) rather than
  # copy it; the one hand copy is noted on the feature profile. The Isaac cloud
  # node and scripts/isaac/contracts_cli.py may run without the package
  # installed and then load its modules from the checkout by file path, which is
  # still the one definition, not a copy.
  - id: simulation.feature_profile.v1
    owner: contracts
    schema_owner: json_schema
    id_field: contract
    schema: cyberwave-contracts/cyberwave_contracts/schemas/simulation.feature_profile.v1.schema.json
    python_source: cyberwave-contracts/cyberwave_contracts/simulation.py
    # Not listed: cyberwave-isaac-sim/cyberwave_isaac_sim/profile.py validates a
    # feature profile by hand and keeps its own copy of the sensor_modalities
    # enum. No sync kind fits a copy nothing checks, so it is named here instead
    # until it validates against the schema.
    mirrors:
      - path: cyberwave-backend/src/lib/simulation_backends.py
        language: python
        # Re-exports the backend and execution-profile identifiers this
        # profile's enums name.
        sync: dependency

  - id: simulation.scene_bundle_manifest.v1
    owner: contracts
    schema_owner: json_schema
    id_field: contract
    schema: cyberwave-contracts/cyberwave_contracts/schemas/simulation.scene_bundle_manifest.v1.schema.json
    python_source: cyberwave-contracts/cyberwave_contracts/simulation.py
    mirrors:
      - path: cyberwave-backend/src/app/services/simulation_scene_bundles.py
        language: python
        sync: dependency
      - path: cyberwave-isaac-sim/cyberwave_isaac_sim/bundle.py
        language: python
        sync: dependency
      - path: cyberwave-isaac-sim/cyberwave_isaac_sim/remote_bundle.py
        language: python
        sync: dependency
      - path: scripts/isaac/build_fixture_bundle.py
        language: python
        sync: dependency
      - path: scripts/isaac/contracts_cli.py
        language: python
        # Loads the package modules from the checkout by path when the package
        # is not installed; the same files, not a copy.
        sync: dependency

  - id: simulation.runtime_audit.v1
    owner: contracts
    schema_owner: json_schema
    id_field: contract
    schema: cyberwave-contracts/cyberwave_contracts/schemas/simulation.runtime_audit.v1.schema.json
    python_source: cyberwave-contracts/cyberwave_contracts/simulation.py
    mirrors:
      - path: cyberwave-isaac-sim/cyberwave_isaac_sim/audit.py
        language: python
        sync: dependency

  - id: simulation.compatibility_attestation.v1
    owner: contracts
    schema_owner: json_schema
    id_field: contract
    schema: cyberwave-contracts/cyberwave_contracts/schemas/simulation.compatibility_attestation.v1.schema.json
    python_source: cyberwave-contracts/cyberwave_contracts/simulation.py
    # No consumer reads this contract yet. The backend's
    # SimulationCompatibilityAttestation model stores the same key fields in its
    # own columns and does not compute key_digest.
    mirrors: []

  - id: simulation.replay_trace.v1
    owner: contracts
    schema_owner: json_schema
    id_field: contract
    schema: cyberwave-contracts/cyberwave_contracts/schemas/simulation.replay_trace.v1.schema.json
    python_source: cyberwave-contracts/cyberwave_contracts/trace.py
    mirrors:
      - path: cyberwave-isaac-sim/cyberwave_isaac_sim/trace.py
        language: python
        sync: dependency
      - path: cyberwave-isaac-sim/cyberwave_isaac_sim/replay.py
        language: python
        sync: dependency
      - path: scripts/isaac/contracts_cli.py
        language: python
        # Loads the package modules from the checkout by path when the package
        # is not installed; the same files, not a copy.
        sync: dependency

  # The hardware fingerprint an Isaac worker's qualification probe records
  # and stores in its cloud-node metadata ("hardware_qualification"). The rule
  # is a VRAM floor, with no GPU-model list and no driver pin. Admission
  # (backend) and dispatch (cloud-node scheduler) both decide with
  # simulation.check_hardware_qualification, so they cannot disagree.
  - id: simulation.hardware_qualification.v1
    owner: contracts
    schema_owner: json_schema
    id_field: contract
    schema: cyberwave-contracts/cyberwave_contracts/schemas/simulation.hardware_qualification.v1.schema.json
    python_source: cyberwave-contracts/cyberwave_contracts/simulation.py
    mirrors:
      - path: cyberwave-backend/src/app/services/simulation_compatibility.py
        language: python
        sync: dependency
      - path: cyberwave-backend/src/lib/cloud_node_provision_utils.py
        language: python
        sync: dependency
      - path: cyberwave-cloud-nodes/cyberwave-isaac-sim-node/cyberwave_isaac_sim_node/_contracts.py
        language: python
        # Imports the package when installed; otherwise loads simulation.py from
        # the checkout by file path. Either way the one definition, not a copy.
        sync: dependency

  # No JSON Schema: the shape is the validator itself. `validate_actuator_config`
  # rejects an actuator declaration by cross-field rules -- which fields are
  # required depends on `effort_model`, and `model_path` is checked for traversal
  # -- so a schema would restate part of it and silently diverge on the rest.
  # Indexed anyway: the index answers "who consumes this contract", and the answer
  # here is five trees, only one of which any drift check watches.
  - id: control.actuator_lstm.v1
    owner: backend
    schema_owner: python
    id_field: contract
    python_source: cyberwave-backend/src/lib/actuator_contracts.py
    mirrors:
      - path: cyberwave-sdks/cyberwave-python/cyberwave/actuator_contracts.py
        language: python
        # Byte-identical to python_source apart from the header, by
        # python-sdk-gen.sh. Drift is checked by the SDK's own
        # tests/test_learned_actuator_contract.py.
        sync: generated

  # The one contract the backend neither defines nor reads, and the reason `owner`
  # and `schema_owner` exist as keys: its shape is a Python dataclass on the edge
  # runtime, it has no JSON Schema, and it versions with an integer field rather
  # than a contract-id const. An index that could not hold it would be an index of
  # the backend's schema directory, not of the monorepo's contracts.
  - id: map_bundle.v1
    owner: edge
    schema_owner: python
    id_field: schema_version
    python_source: cyberwave-edge-runtime/runtime-services/intelligence/common/python/cyberwave_map_bundle/bundle.py
    mirrors: []

  # --- Sections ---------------------------------------------------------------
  #
  # A section contract describes one part of a stored JSON field rather than a
  # message on the wire, so it has no id_field: it is identified by `location`
  # (`Entity.field[.path]`). `section_kind` says who may write it -- configuration,
  # catalog, reported, derived or bookkeeping -- and `merge` (Asset.* sections
  # only, default instance_only) says how a twin inherits it. Section schemas live
  # in sections/, which GET /api/v1/contracts and the SDK do not serve.

  # The pilot section: the georeference the platform already validates
  # strictly, so this describes existing behaviour without changing it.
  - id: environment.settings.geo.v1
    kind: section
    owner: backend
    schema_owner: json_schema
    location: Environment.settings.geo
    section_kind: configuration
    schema: cyberwave-contracts/cyberwave_contracts/sections/environment.settings.geo.v1.schema.json
    python_source: cyberwave-backend/src/lib/geo_transform.py
    mirrors: []
